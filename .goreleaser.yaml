version: 2

project_name: peer

builds:
  - id: darwin
    binary: peer
    env: &env
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: &goarch [amd64, arm64]
    flags: &flags
      - -trimpath
    ldflags: &ldflags
      - -s -w -X main.version={{.Version}}
  - id: linux
    binary: peer
    env: *env
    goos: [linux]
    goarch: *goarch
    flags: *flags
    ldflags: *ldflags

# The cask takes only the darwin archive: its xattr postflight is macOS-only,
# and Linux installs with scripts/install.sh instead.
archives:
  - id: darwin
    ids: [darwin]
    # No version in the name, so releases/latest/download/ always finds it.
    name_template: &archive_name "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: &formats [tar.gz]
    files: &files
      - README.md
  - id: linux
    ids: [linux]
    name_template: *archive_name
    formats: *formats
    files: *files

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github

homebrew_casks:
  - name: peer
    ids: [darwin]
    binaries: [peer]
    repository:
      owner: r13v
      name: homebrew-apps
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/r13v/peer"
    description: "Local CLI for two coding agents pairing on one Git checkout"
    # Homebrew 7 deprecates `postflight do` blocks, which is how GoReleaser
    # renders `hooks`, so emit declarative install steps instead.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/peer"]
      end

release:
  github:
    owner: r13v
    name: peer
  replace_existing_artifacts: true
  extra_files:
    - glob: scripts/install.sh
