version: 2

project_name: peer

builds:
  - id: peer
    binary: peer
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github

homebrew_casks:
  - name: peer
    binaries: [peer]
    repository:
      owner: r13v
      name: homebrew-apps
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/r13v/peer"
    description: "Local CLI for two coding agents pairing on one Git checkout"
    # Homebrew 7 deprecates `postflight do` blocks, which is how GoReleaser
    # renders `hooks`, so emit declarative install steps instead.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/peer"]
      end

release:
  github:
    owner: r13v
    name: peer
  replace_existing_artifacts: true
