name: Publish latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peer-latest
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check
        run: |
          go test ./...
          go vet ./...
      - name: Build macOS archives
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "dist/$arch/peer" .
            cp skills/peer/SKILL.md "dist/$arch/SKILL.md"
            tar -czf "dist/peer-darwin-$arch.tar.gz" -C "dist/$arch" peer SKILL.md
          done
          (cd dist && sha256sum peer-darwin-*.tar.gz > checksums.txt)
          cp scripts/install.sh dist/install.sh
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/peer-darwin-*.tar.gz --clobber
            gh release upload latest dist/checksums.txt dist/install.sh --clobber
            gh release edit latest --title latest --notes "Current main: $GITHUB_SHA" --target "$GITHUB_SHA" --latest
          else
            gh release create latest dist/peer-darwin-*.tar.gz dist/checksums.txt dist/install.sh \
              --title latest --notes "Current main: $GITHUB_SHA" --verify-tag --latest
          fi
