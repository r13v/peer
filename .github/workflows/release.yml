name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Test
        run: make test
      - name: Pick version tag
        id: tag
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$HOMEBREW_TAP_TOKEN" ] || { echo "HOMEBREW_TAP_TOKEN is not set" >&2; exit 1; }
          git fetch --force --tags origin main
          # A queued run for an older commit must not publish over a newer release.
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "main moved past $GITHUB_SHA; skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          # A rerun reuses the tag already on this commit.
          tag="$(git tag --points-at "$GITHUB_SHA" | grep -E "$semver" | sort -V | tail -n 1 || true)"
          if [ -z "$tag" ]; then
            last="$(git tag --list 'v*' | grep -E "$semver" | sort -V | tail -n 1 || true)"
            if [ -z "$last" ]; then
              tag=v0.1.0
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              tag="v$major.$minor.$((patch + 1))"
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Release
        if: steps.tag.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
