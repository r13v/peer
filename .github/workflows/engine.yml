name: Claude Code

# Checks the plugin against the latest Claude Code every day, so a Claude
# Code release that breaks the plugin fails here before users update. The
# typecheck has that Claude Code write its types by loading the plugin in a
# pseudo-terminal; the tests run in the kit inside the claude binary. Neither
# needs a login.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version
      - name: Validate
        run: claude plugin validate plugin
      - name: Typecheck
        run: |
          npm ci --ignore-scripts
          npm run typecheck:plugin
      - name: Test
        run: claude plugin test plugin
